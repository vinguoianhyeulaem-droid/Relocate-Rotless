name: Build Relocate Rootless

on:
  workflow_dispatch:
  push:
    branches:
      - rootless-test

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5

      - name: Inspect CepheiPrefs and source compatibility
        shell: bash
        run: |
          echo '=== Active rootless CepheiPrefs headers ==='
          ROOTLESS_HEADERS="$THEOS/vendor/lib/iphone/rootless/CepheiPrefs.framework/Headers"
          if [ -d "$ROOTLESS_HEADERS" ]; then
            find "$ROOTLESS_HEADERS" -maxdepth 1 -type f -print | sort
          else
            echo 'Rootless CepheiPrefs framework headers not found.'
          fi
          echo '=== Appearance imports in repository ==='
          grep -Rn 'HBAppearanceSettings\|CepheiPrefs.h' Prefs || true
          echo '=== Original legacy header availability ==='
          find "$THEOS/vendor/lib" -name 'HBAppearanceSettings.h' -print || true

      
      - name: Patch missing headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Add UIKit and QuartzCore to view headers
          for name in [
              "RLCHelpView.h",
              "RLCCrossHairView.h",
          ]:
              p = Path("Prefs") / name
              if p.exists():
                  s = p.read_text()
                  imports = (
                      "#import <UIKit/UIKit.h>\n"
                      "#import <QuartzCore/QuartzCore.h>\n"
                  )
                  if "#import <UIKit/UIKit.h>" not in s:
                      s = imports + s
                  p.write_text(s)

          # Replace missing individual import with umbrella header
          for p in Path("Prefs").rglob("*"):
              if p.suffix not in (".h", ".m", ".mm"):
                  continue
              s = p.read_text()
              s = s.replace(
                  "#import <CepheiPrefs/HBAppearanceSettings.h>",
                  "#import <CepheiPrefs/CepheiPrefs.h>"
              )
              p.write_text(s)

          print("Header patches applied.")
          PY
      
      - name: Install AppList rootless build library
        shell: bash
        run: |
          set -euo pipefail

          DEB="deps/xyz.cypwn.applist_1.5.16_iphoneos-arm64.deb"
          EXTRACT="$RUNNER_TEMP/applist"
          DEST="$THEOS/vendor/lib/iphone/rootless"

          mkdir -p "$EXTRACT" "$DEST"

          ar -p "$DEB" data.tar.gz | tar -xz -C "$EXTRACT"

          cp "$EXTRACT/var/jb/usr/lib/libapplist.dylib" \
            "$DEST/libapplist.dylib"

          echo "AppList rootless installed for linking"
          ls -lh "$DEST/libapplist.dylib"

      - name: Install patched iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          cd "$RUNNER_TEMP/theos-sdks"
          git sparse-checkout set iPhoneOS15.6.sdk

          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS15.6.sdk "$THEOS/sdks/"

          SDK="$THEOS/sdks/iPhoneOS15.6.sdk"

          test -d "$SDK/System/Library/PrivateFrameworks/Preferences.framework"

          echo "Patched SDK installed"
          ls "$SDK/System/Library/PrivateFrameworks/Preferences.framework"

      - name: Apply Relocate Final .23final
        shell: bash
        run: |
          python3 patch_relocate_final_023.py Tweak/Tweak.xm

      - name: Compile and package rootless
        shell: bash
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET=iphone:clang:15.6:15.0 \
            SDKVERSION=15.6

      - name: Upload build logs and DEB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relocate-rootless-output
          path: |
            packages/*.deb
            .theos/obj/**/*.log
          if-no-files-found: warn

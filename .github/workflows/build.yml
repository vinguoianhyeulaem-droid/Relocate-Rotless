name: Build Relocate Rootless

on:
  workflow_dispatch:
  push:
    branches:
      - rootless-test

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5

      - name: Inspect CepheiPrefs and source compatibility
        shell: bash
        run: |
          echo '=== Active rootless CepheiPrefs headers ==='
          ROOTLESS_HEADERS="$THEOS/vendor/lib/iphone/rootless/CepheiPrefs.framework/Headers"
          if [ -d "$ROOTLESS_HEADERS" ]; then
            find "$ROOTLESS_HEADERS" -maxdepth 1 -type f -print | sort
          else
            echo 'Rootless CepheiPrefs framework headers not found.'
          fi
          echo '=== Appearance imports in repository ==='
          grep -Rn 'HBAppearanceSettings\|CepheiPrefs.h' Prefs || true
          echo '=== Original legacy header availability ==='
          find "$THEOS/vendor/lib" -name 'HBAppearanceSettings.h' -print || true

      
      - name: Patch missing headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Add UIKit and QuartzCore to view headers
          for name in [
              "RLCHelpView.h",
              "RLCCrossHairView.h",
          ]:
              p = Path("Prefs") / name
              if p.exists():
                  s = p.read_text()
                  imports = (
                      "#import <UIKit/UIKit.h>\n"
                      "#import <QuartzCore/QuartzCore.h>\n"
                  )
                  if "#import <UIKit/UIKit.h>" not in s:
                      s = imports + s
                  p.write_text(s)

          # Replace missing individual import with umbrella header
          for p in Path("Prefs").rglob("*"):
              if p.suffix not in (".h", ".m", ".mm"):
                  continue
              s = p.read_text()
              s = s.replace(
                  "#import <CepheiPrefs/HBAppearanceSettings.h>",
                  "#import <CepheiPrefs/CepheiPrefs.h>"
              )
              p.write_text(s)

          print("Header patches applied.")
          PY
      
      - name: Check AppList linking
        run: |
          echo "Checking AppList libraries..."

          find "$THEOS/vendor/lib" \
            \( -iname '*applist*' -o -iname '*sparkapplist*' \) \
            -print

          echo "Checking rootless AppList..."
          if [ -f "$THEOS/vendor/lib/iphone/rootless/libapplist.tbd" ]; then
            echo "Rootless AppList stub found."
          else
            echo "Rootless AppList stub missing."
          fi

          echo "Checking AppList dependency..."
          grep -Rni 'LIBRARIES.*applist' Prefs || true
      
      - name: Verify rootless AppList library
        shell: bash
        run: |
          set -e

          echo "Checking AppList libraries"

          find "$THEOS/vendor/lib" \
            -iname '*applist*' -print

          ROOTLESS_DIR="$THEOS/vendor/lib/iphone/rootless"
          mkdir -p "$ROOTLESS_DIR"

          if [ -f "$ROOTLESS_DIR/libapplist.tbd" ] ||
             [ -f "$ROOTLESS_DIR/libapplist.dylib" ]; then
            echo "Rootless AppList library found"
          else
            echo "::error::Missing rootless AppList link library"
            echo "Need a rootless-compatible AppList .tbd or .dylib"
            exit 1
          fi
    
    


      - name: Compile and package rootless
        shell: bash
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 ARCHS=arm64 TARGET=iphone:clang:latest:15.0

      - name: Upload build logs and DEB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relocate-rootless-output
          path: |
            packages/*.deb
            .theos/obj/**/*.log
          if-no-files-found: warn
